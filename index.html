<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>rPad</title>
  <meta name="theme-color" content="#f9f8fc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#190f2a" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="rPad">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-maskable.svg">
  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script src="src/themes.js"></script>
  <script src="editor.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: { colors: themeColors, fontFamily: { sans: ["Figtree", "system-ui", "sans-serif"], mono: ['"Spline Sans Mono"', "ui-monospace", "Menlo", "monospace"] } } }
    }
  </script>
  <style>
    /* Windows layout (VS Code style): activity bar | sidebar | editor, status bar along the bottom */
    /* Phone look: pill tabs, brighter chrome icons and counter (desktop overrides below) */
    #tabs { gap: 6px; padding: 0 12px }
    #tabs .tab { margin: 6px 0; padding: 0 8px 0 12px; border-radius: 9999px }
    #tabs .tab.on { background: rgb(var(--a500) / .16) }
    #tabs .tab.on::after { display: none }
    #top { border-bottom: 1px solid rgb(var(--n200)) }
    .dark #top { border-bottom-color: rgb(var(--n800)) }
    #star, #wsb { color: rgb(var(--n600)) }
    .dark #star, .dark #wsb { color: rgb(var(--n300)) }
    .dark #ct { color: rgb(var(--n300)) }
    @media (min-width: 900px) {
      #app { display: grid; grid-template-columns: 48px var(--sbw, 260px) minmax(0, 1fr); grid-template-rows: 30px auto auto auto auto minmax(0, 1fr) 24px; padding: 0 }
      #app.sbh { grid-template-columns: 48px 0 minmax(0, 1fr) }
      #app > * { grid-column: 3 }
      #mb { grid-column: 1 / -1; grid-row: 1; z-index: 25 }
      #qp { grid-column: 1 / -1; grid-row: 1 / -1; z-index: 35 }
      #ab { grid-column: 1; grid-row: 2 / 7 }
      #sb { grid-column: 2; grid-row: 2 / 7 }
      #tr { grid-row: 2; height: 36px; background: rgb(var(--n100)) }
      .dark #tr { background: rgb(var(--n950)) }
      #bn { grid-row: 3 } #ed { grid-row: 6 }
      /* Find floats over the top right of the editor */
      #fd, #rp { grid-row: 6; align-self: start; justify-self: end; z-index: 15; width: min(440px, calc(100% - 40px)); margin-right: 20px; box-shadow: 0 4px 14px rgb(0 0 0 / .12) }
      #rp { margin-top: 62px }
      #st { grid-column: 1 / -1; grid-row: 7 }
      #sw { grid-row: 2 / 7 }
      #sh, #ts { grid-column: 1 / -1; grid-row: 1 / -1 }
      #top, #fb, #tb, #tg, #ct, #sheet > .hdl { display: none !important }
      .dk { display: flex !important }
      #app.sbh #sb { display: none !important }
      #sh { align-items: center }
      /* dialogs: compact and square-ish like VS Code */
      #sh { align-items: flex-start; padding-top: 12vh; background: rgb(0 0 0 / .3) }
      #sheet { border-radius: 6px; max-width: 460px; padding: 4px 4px 8px; font-size: 13px; border: 1px solid rgb(var(--n200)); box-shadow: 0 8px 24px rgb(0 0 0 / .25) }
      .dark #sheet { border-color: rgb(var(--n700)) }
      #sheet h3 { font-size: 13px; padding-top: 6px; padding-bottom: 6px }
      #sheet .py-3 { padding-top: 5px; padding-bottom: 5px }
      #sheet .py-2\.5, #sheet .py-2 { padding-top: 4px; padding-bottom: 4px }
      #sheet .rounded-xl, #sheet .rounded-full, #sheet .rounded-lg, #sheet .rounded-md { border-radius: 4px }
      #sheet [data-a]:hover { background: rgb(var(--n100)) }
      .dark #sheet [data-a]:hover { background: rgb(var(--n700)) }
      #sheet .size-5 { width: 16px; height: 16px; border-width: 1px }
      #sheet .size-10 { width: 28px; height: 28px }
      #sheet .shadow { box-shadow: none }
      #tabs { gap: 0; padding: 0; -webkit-mask-image: none; mask-image: none }
      #tabs .tab { padding: 0 8px 0 12px; max-width: 220px; font-size: 13px; border-right: 1px solid rgb(var(--n200)) }
      .dark #tabs .tab { border-color: rgb(var(--n800)) }
      #tabs .tab.on { background: rgb(var(--n50)) }
      .dark #tabs .tab.on { background: rgb(var(--n900)) }
      #tabs .tab.on::after { top: 0; bottom: auto }
      #ed .cm-scroller { scrollbar-gutter: stable }
      /* Look: separate rounded cards on a backdrop, pill tabs, borderless chrome (same layout as before) */
      #app { padding: 0 8px; grid-template-rows: 30px auto auto auto auto minmax(0, 1fr) 32px; column-gap: 0; grid-template-columns: 0 var(--sbw, 260px) minmax(0, 1fr); background: rgb(var(--n200)) }
      #app.sbh { grid-template-columns: 0 0 minmax(0, 1fr) }
      .dark #app { background: rgb(var(--n950)) }
      #mb, #st, #ab { background: transparent; border: 0 }
      #st { padding: 0; align-items: center; font-size: 12px; color: rgb(var(--n700)) }
      .dark #st { color: rgb(var(--n300)) }
      #st > * { border-radius: 6px; padding: 2px 12px; line-height: 20px }
      #st > button:hover, #st > [data-a]:hover { background: rgb(var(--n500) / .15) }
      #sb { margin-right: 8px; padding-top: 44px; background: rgb(var(--n50)); border: 1px solid rgb(var(--n300)); border-radius: 12px; box-shadow: 0 1px 2px rgb(0 0 0 / .04) }
      #sbc { overflow: hidden; border-radius: 0 0 11px 11px }
      .dark #sb { background: rgb(var(--n900)); border-color: rgb(var(--n800)) }
      #rz { right: -8px; width: 8px; border-radius: 4px }
      #tr { height: 42px; background: rgb(var(--n50)); border: 1px solid rgb(var(--n300)); border-bottom: 0; border-radius: 12px 12px 0 0 }
      .dark #tr { background: rgb(var(--n900)); border-color: rgb(var(--n800)) }
      #ed { margin: 0; background: rgb(var(--n50)); border: 1px solid rgb(var(--n300)); border-top: 0; border-radius: 0 0 12px 12px; overflow: hidden }
      .dark #ed { background: rgb(var(--n900)); border-color: rgb(var(--n800)) }
      #tabs { gap: 4px; padding: 6px 8px }
      #tabs .tab { border: 0; border-radius: 8px; margin: 0; padding: 0 8px 0 12px }
      #tabs .tab:hover { background: rgb(var(--n500) / .12) }
      #tabs .tab.on, .dark #tabs .tab.on { background: rgb(var(--a500) / .16) }
      #tabs .tab.on::after { display: none }
      #sb .nc-on .ni { color: rgb(var(--a600)) }
      .dark #sb .nc-on .ni { color: rgb(var(--a400)) }
      #ab { margin-right: 8px; grid-column: 2; grid-row: 2; align-self: start; z-index: 6; flex-direction: row; align-items: center; height: 44px; padding: 0 8px; gap: 2px }
      #app.sbh #ab { display: none !important }
      #ab button { width: 34px; height: 34px; border-radius: 10px }
      #ab button.tb { width: auto; padding: 0 12px 0 10px; gap: 6px; display: flex; font-size: 13px; font-weight: 500 }
      #ab button.tb svg { width: 18px; height: 18px }
      #ab button:not(.tb) { width: 30px; height: 30px }
      #ab button:not(.tb) svg { width: 16px; height: 16px }
      #ab button::before { display: none !important }
      #ab button[aria-pressed=true] { background: rgb(var(--a500) / .16) }
      #ab button:hover { background: rgb(var(--n500) / .12) }
      /* sidebar content (note list, Settings) uses one text size */
      #nl, #sb .stg { font-size: 14px; line-height: 20px }
      #sb .stg .text-\[13px\], #sb .stg .text-sm { font-size: 14px }
    }
  /* VS Code-style scrollbars (mouse devices only; phones keep the native overlay bar) */
  @media (hover:hover) and (pointer:fine){
    #ed .cm-scroller::-webkit-scrollbar{width:14px;height:14px;background:transparent}
    #ed .cm-scroller::-webkit-scrollbar-track,#ed .cm-scroller::-webkit-scrollbar-corner{background:transparent}
    @keyframes shF{from{opacity:0}} @keyframes shU{from{transform:translateY(100%)}} @keyframes shP{from{opacity:0;transform:translateY(-10px) scale(.97)}}
    #sh{overflow:hidden;overscroll-behavior:contain} #sh.flex{animation:shF .2s ease-out} #sh.flex #sheet{animation:shU .3s cubic-bezier(.2,.8,.2,1)}
    #sh.out{animation:shF .18s ease-in reverse forwards} #sh.out #sheet{animation:shU .18s ease-in reverse forwards}
    @media (min-width:900px){#sh.flex #sheet{animation:shP .18s cubic-bezier(.2,.8,.2,1)} #sh.out #sheet{animation:shP .12s ease-in reverse forwards}}
    @media (prefers-reduced-motion:reduce){#sh,#sh #sheet{animation:none!important}}
    #ed .cm-scroller::-webkit-scrollbar-thumb{background:rgb(var(--n500)/.3);border:3px solid transparent;background-clip:padding-box;border-radius:7px;min-height:40px;min-width:40px;transition:background-color .15s}
    #ed .cm-scroller:hover::-webkit-scrollbar-thumb{background-color:rgb(var(--n500)/.45)}
    #ed .cm-scroller::-webkit-scrollbar-thumb:hover{background-color:rgb(var(--n500)/.75)}
    #ed .cm-scroller::-webkit-scrollbar-thumb:active{background-color:rgb(var(--n500)/.95)}
    #ed .cm-scroller::-webkit-scrollbar-button{display:none}
    @supports not selector(::-webkit-scrollbar){#ed .cm-scroller{scrollbar-width:thin;scrollbar-color:rgb(var(--n500)/.5) transparent}}
  }
#sheet::-webkit-scrollbar,.overflow-y-auto::-webkit-scrollbar{width:8px;background:transparent}#sheet::-webkit-scrollbar-thumb,.overflow-y-auto::-webkit-scrollbar-thumb{background:rgb(var(--n500)/.45);border-radius:4px}#sheet::-webkit-scrollbar-thumb:hover,.overflow-y-auto::-webkit-scrollbar-thumb:hover{background:rgb(var(--n500)/.8)}#sheet::-webkit-scrollbar-button,.overflow-y-auto::-webkit-scrollbar-button{display:none}
#cmh{position:absolute;inset:0}
#ed .cm-editor{height:100%;font-size:var(--fs,17px);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
#ed.sans .cm-editor{font-family:inherit}
#ed.cf .cm-editor{font-family:var(--ff)!important}
#ed .cm-editor.cm-focused{outline:none}
#ed .cm-scroller{line-height:1.6;font-family:inherit;align-items:stretch!important}
#ed .cm-panels{display:none}
#ed .cm-content{padding:12px 18px 44px;min-height:100%;caret-color:rgb(var(--a600))}
.dark #ed .cm-content{caret-color:rgb(var(--a400))}
#ed .cm-line{padding:0}
#ed .cm-placeholder{color:rgb(var(--n500))}
#ed .cm-placeholder:has(.wph){position:relative;display:inline-block}
.wph{position:absolute;white-space:normal;left:16px;top:-.12em;width:max-content;max-width:min(40em,calc(100vw - 120px));font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.5;user-select:none}
.wph-t{line-height:1.2;font-size:1.9em;font-weight:600;letter-spacing:-.01em;color:rgb(var(--n700))}.dark .wph-t{color:rgb(var(--n200))}
.wph-s{font-size:.95em;margin-top:6px;text-wrap:pretty}.wph-s+.wph-s{margin-top:12px}
.wph-g{display:grid;grid-template-columns:max-content auto;gap:8px 16px;align-items:center;margin-top:22px;font-size:.9em}
.wph-g kbd{font:inherit;font-size:.85em;padding:2px 8px;border-radius:6px;border:1px solid rgb(var(--n300));background:rgb(var(--n100));color:rgb(var(--n600))}
.dark .wph-g kbd{border-color:rgb(var(--n700));background:rgb(var(--n800));color:rgb(var(--n300))}
#ed .cm-line:has(.cm-placeholder){background:transparent!important}
.dark #ed .cm-placeholder{color:rgb(var(--n400))}
#ed .cm-gutters{background:rgb(var(--n50));z-index:2;border:0;border-right:1px solid rgb(var(--n300));color:rgb(var(--n400));padding-left:10px}
.dark #ed .cm-gutters{background:rgb(var(--n900));border-color:rgb(var(--n600));color:rgb(var(--n500))}
#ed .cm-lineNumbers .cm-gutterElement{padding:0 12px 0 4px}
#ed.ro .cm-content{opacity:.5}
#ed .cm-searchMatch{background:#fef08a;border-radius:3px}.dark #ed .cm-searchMatch{background:rgb(161 98 7/.6)}
#ed .cm-searchMatch.cm-searchMatch-selected{background:#fdba74}.dark #ed .cm-searchMatch.cm-searchMatch-selected{background:rgb(234 88 12/.7)}
#ed .cm-activeLine,#ed .cm-activeLineGutter{background:transparent}
@media (min-width:900px){#ed .cm-activeLine{background:rgb(var(--n500)/.08)}}
#ed .cm-activeLineGutter{color:rgb(var(--n700));font-weight:600}.dark #ed .cm-activeLineGutter{color:rgb(var(--n200))}
</style>
</head>

<body
  class="m-0 h-full bg-slate-200 font-sans text-[15px] leading-snug text-slate-900 [-webkit-tap-highlight-color:transparent] dark:bg-slate-950 dark:text-slate-100">
  <div id="app"
    class="relative flex h-dvh w-full flex-col overflow-hidden bg-slate-50 pb-[env(safe-area-inset-bottom)] pt-[env(safe-area-inset-top)] dark:bg-slate-900">
    <div id="mb" role="menubar" aria-label="Menu"
      class="dk relative hidden items-center gap-0.5 border-b border-slate-200 bg-slate-100 px-1.5 text-[13px] dark:border-slate-800 dark:bg-slate-950"></div>
    <div id="qp" class="absolute left-1/2 top-[3px] hidden w-[min(600px,90%)] -translate-x-1/2 flex-col rounded-lg border border-slate-200 bg-white p-1 text-[13px] shadow-xl dark:border-slate-700 dark:bg-slate-800">
      <input id="qpi" autocomplete="off" aria-label="Search tabs, or type > for commands"
        class="mb-1 h-7 rounded-md border border-violet-500 bg-transparent px-2 outline-none placeholder:text-slate-500 dark:placeholder:text-slate-400"
        placeholder="Search tabs by name (type > for commands)">
      <div id="qpl" role="listbox" class="max-h-[60vh] overflow-y-auto"></div>
    </div>
    <input id="fop" type="file" multiple class="hidden">
    <nav id="ab" aria-label="Views"
      class="dk hidden min-h-0 flex-col items-center gap-1 border-r border-slate-200 bg-slate-100 py-2 dark:border-slate-800 dark:bg-slate-950"></nav>
    <aside id="sb" class="dk relative hidden min-h-0 min-w-0 flex-col border-r border-slate-200 bg-slate-100 text-[13px] dark:border-slate-800 dark:bg-slate-950">
      <div id="sbc" class="flex min-h-0 flex-1 flex-col"></div>
      <div id="rz" class="absolute inset-y-0 -right-1 z-10 w-2 cursor-col-resize hover:bg-violet-500/40"></div>
    </aside>
    <div id="top" class="flex h-12 shrink-0 items-center pl-3 pr-0 [#app.kb_&]:hidden">
      <img id="lg" src="assets/icon.svg" alt="" class="mr-1 hidden size-7 shrink-0">
      <button id="wsb" data-a="ws" aria-label="Choose folder"
        class="flex h-9 items-center gap-1.5 rounded-full pl-3 pr-2 text-sm font-medium text-slate-500 active:bg-slate-200 dark:text-slate-400 dark:active:bg-slate-700"></button>
      <div class="flex-1"></div>
      <button id="star" data-a="star" aria-label="Star"
        class="grid size-11 shrink-0 place-items-center rounded-xl active:bg-slate-200/70 dark:active:bg-slate-700"></button>
    </div>
    <div id="tr" class="flex h-11 shrink-0 border-b border-slate-200 dark:border-slate-700">
      <div id="tabs" role="tablist" aria-label="Open tabs"
        class="flex h-full min-w-0 flex-1 items-stretch gap-6 overflow-x-auto px-5 [-webkit-mask-image:linear-gradient(90deg,transparent,#000_16px,#000_calc(100%_-_28px),transparent)] [mask-image:linear-gradient(90deg,transparent,#000_16px,#000_calc(100%_-_28px),transparent)] [scrollbar-width:none]">
      </div>
      <button data-a="find" aria-label="Find" title="Find (Ctrl+F)"
        class="dk hidden w-9 shrink-0 items-center justify-center text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white"></button>
      <button data-a="menu" aria-label="More actions" title="More actions"
        class="dk hidden w-9 shrink-0 items-center justify-center text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white"></button>
      <button id="tg" data-a="top" aria-label="Hide top row"
        class="grid w-11 shrink-0 place-items-center text-slate-500 active:bg-slate-100 dark:text-slate-400 dark:active:bg-slate-700"></button>
    </div>
    <div id="bn"
      class="mx-2.5 mt-2 hidden rounded-xl bg-amber-100 p-3 text-[13.5px] text-amber-900 dark:bg-amber-500/15 dark:text-amber-300">
    </div>
    <div id="fd"
      class="mx-2.5 mt-2 hidden h-12 items-center gap-0.5 rounded-xl border border-slate-200 bg-white pl-3 pr-0.5 dark:border-slate-700 dark:bg-slate-800">
      <input id="fi" placeholder="Find in this tab" autocomplete="off"
        class="min-w-0 flex-1 bg-transparent outline-none placeholder:text-slate-500 dark:placeholder:text-slate-400">
      <span id="fc" class="px-1 text-xs text-slate-500 dark:text-slate-400"></span>
      <button data-a="fcs" aria-label="Match case" aria-pressed="false"
        class="h-11 rounded-lg px-2 text-[13px] font-semibold text-slate-500 active:bg-slate-100 aria-pressed:bg-violet-100 aria-pressed:text-violet-700 dark:text-slate-400 dark:active:bg-slate-700 dark:aria-pressed:bg-violet-500/20 dark:aria-pressed:text-violet-300">Aa</button>
      <button data-a="fp" aria-label="Previous"
        class="grid size-11 place-items-center rounded-lg text-slate-500 active:bg-slate-100 dark:text-slate-400 dark:active:bg-slate-700"></button>
      <button data-a="fn" aria-label="Next"
        class="grid size-11 place-items-center rounded-lg text-slate-500 active:bg-slate-100 dark:text-slate-400 dark:active:bg-slate-700"></button>
      <button data-a="rpt" aria-label="Replace" class="grid size-11 place-items-center rounded-lg text-slate-500 active:bg-slate-100 dark:text-slate-400 dark:active:bg-slate-700"></button>
      <button data-a="find" aria-label="Close find"
        class="grid size-11 place-items-center rounded-lg text-slate-500 active:bg-slate-100 dark:text-slate-400 dark:active:bg-slate-700"></button>
    </div>
    <div id="rp"
      class="mx-2.5 mt-1.5 hidden h-12 items-center gap-1 rounded-xl border border-slate-200 bg-white pl-3 pr-1 dark:border-slate-700 dark:bg-slate-800">
      <input id="ri" placeholder="Replace with" autocomplete="off"
        class="min-w-0 flex-1 bg-transparent outline-none placeholder:text-slate-500 dark:placeholder:text-slate-400">
      <button data-a="rp1" class="h-11 rounded-lg px-3 text-[13px] font-medium text-violet-600 active:bg-slate-100 dark:text-violet-400 dark:active:bg-slate-700">Replace</button>
      <button data-a="rpa" class="h-11 rounded-lg px-3 text-[13px] font-medium text-violet-600 active:bg-slate-100 dark:text-violet-400 dark:active:bg-slate-700">All</button>
    </div>
    <div id="ed" class="group relative mt-1 min-h-0 flex-1">
      <div id="wl" class="pointer-events-none absolute inset-0 z-[5] hidden flex-col overflow-y-auto px-6 pt-10 text-[14px] md:px-16 md:pt-16"></div>
      <div id="cmh" class="absolute inset-0"></div>
      <div id="ct"
        class="pointer-events-none absolute bottom-2 right-3.5 [#app.kb_&]:hidden rounded-full bg-slate-50 px-2.5 py-0.5 text-xs text-slate-500 dark:bg-slate-900 dark:text-slate-400">
      </div>
    </div>
    <div id="fb" class="flex h-12 shrink-0 items-center gap-1 overflow-x-auto [#app:not(:has(.cm-content:focus))_&]:hidden [#app.fo_&]:hidden border-t border-slate-200 bg-white pl-2 pr-0 [scrollbar-width:none] dark:border-slate-700 dark:bg-slate-800">
      <button data-f="c" aria-label="Checkbox" class="h-11 min-w-[44px] shrink-0 rounded-lg px-3 font-mono text-[15px] font-medium text-slate-600 active:bg-slate-100 dark:text-slate-300 dark:active:bg-slate-700">[ ]</button>
      <button data-f="x" aria-label="Tick or untick checkbox" class="h-11 min-w-[44px] shrink-0 rounded-lg px-3 font-mono text-[15px] font-medium text-slate-600 active:bg-slate-100 dark:text-slate-300 dark:active:bg-slate-700">[x]</button>
      <button data-f="b" aria-label="Bullet list" class="h-11 min-w-[44px] shrink-0 rounded-lg px-3 font-mono text-[17px] font-medium text-slate-600 active:bg-slate-100 dark:text-slate-300 dark:active:bg-slate-700">•</button>
      <button data-f="n" aria-label="Numbered list" class="h-11 min-w-[44px] shrink-0 rounded-lg px-3 font-mono text-[15px] font-medium text-slate-600 active:bg-slate-100 dark:text-slate-300 dark:active:bg-slate-700">1.</button>
      <button data-f="out" aria-label="Outdent" class="h-11 min-w-[44px] shrink-0 rounded-lg px-3 font-mono text-[17px] font-medium text-slate-600 active:bg-slate-100 dark:text-slate-300 dark:active:bg-slate-700">⇤</button>
      <button data-f="in" aria-label="Indent" class="h-11 min-w-[44px] shrink-0 rounded-lg px-3 font-mono text-[17px] font-medium text-slate-600 active:bg-slate-100 dark:text-slate-300 dark:active:bg-slate-700">⇥</button>
    </div>
    <div id="tb"
      class="flex h-[58px] shrink-0 items-center justify-around [#app.kb_&]:hidden border-t border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800">
      <button data-a="find" aria-label="Find"
        class="grid h-[46px] w-[58px] place-items-center rounded-xl text-slate-500 active:bg-slate-100 dark:text-slate-400 dark:active:bg-slate-700"></button>
      <button data-a="new" aria-label="New tab"
        class="grid h-[46px] w-[58px] place-items-center rounded-xl text-slate-500 active:bg-slate-100 dark:text-slate-400 dark:active:bg-slate-700"></button>
      <button data-a="grid" aria-label="All tabs"

    if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => { });
  </script>
