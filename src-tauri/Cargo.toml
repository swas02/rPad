[package]
name = "rpad"
version = "0.0.0-alpha"
description = "rPad: fast plain text notepad"
edition = "2021"

[lib]
name = "rpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"

# Title bar colour (DwmSetWindowAttribute). Same version as Tauri uses, so no second copy is built.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

# Small, fast binary. Nothing here changes webview memory, but it keeps the Rust side negligible.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
