[package]
name = "rpad"
version = "0.0.0-alpha"
description = "rPad: fast plain text notepad"
edition = "2021"

[lib]
name = "rpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression"] }

# Small, fast binary. Nothing here changes webview memory, but it keeps the Rust side negligible.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
